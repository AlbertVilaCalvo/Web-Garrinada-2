<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Garrinada 2018 - Argentona - 4, 5 i 6 d'agost - Festa Major de Sant Domènec</title>
  <link href="https://fonts.googleapis.com/css?family=Amatic+SC" rel="stylesheet">
  <style>
    body {
      font-family: 'Amatic SC', cursive;
      background-color: pink;
      display: flex;
      flex-direction: column;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .row-wrap {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    .titol {
      font-size: 52px;
      margin-top: 10px;
      margin-bottom: 0px;
    }
    .dia {
      font-size: 32px;
      margin: 30px 0 20px 0;
    }
    .hora {
      font-size: 28px;
      margin: 0;
    }
    .grups {
      margin-top: 12px;
      margin-bottom: 14px;
    }
    .grups h2 {
      font-size: 32px;
      margin: 0px 20px;
    }
    .info {
      margin-bottom: 18px;
    }
    .info span {
      font-size: 26px;
      margin: 0px 12px;
    }
    img {
      width: 100%;
      max-width: 700px;
    }
    footer {
      text-align: center;
      margin-top: 22px;
      margin-bottom: 8px;
    }
    footer a {
      margin: 0 20px;
    }
    .social-icon {
      height: 32px;
      width: 32px;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="titol">Garrinada 2018</h1>
    <div class="row-wrap info">
      <span>Argentona</span>
      <span>4, 5 i 6 d'agost a l'Escola Argentona</span>
      <span>Festa Major de Sant Domènec</span>
    </div>
    <img src="cartell_garrinada_2018.jpg" alt="Cartell Garrinada 2018">
    <p class="dia">~ Dissabte 4 ~</p>
    <p class="hora">23:30h En acabar els focs</p>
    <div class="row-wrap grups">
      <h2>Cercavila amb la Sidral Brass Band</h2>
    </div>
    <p class="hora">00:00h Concerts</p>
    <div class="row-wrap grups">
      <div>
        <h2>La Sra. Tomasa</h2>
        <p>Fusió llatí i electrònica</p>
      </div>
      <div>
        <h2>Crim</h2>
        <p>Punk-Rock</p>
      </div>
      <div>
        <h2>DJ Hochi</h2>
        <p>Resident Sala Clap</p>
      </div>
    </div>
  </main>
  <footer>
    <a href="https://twitter.com/lagarrinada"><img class="social-icon" src="twitter.svg" alt="Twitter"></a>
    <a href="https://www.facebook.com/garrinada"><img class="social-icon" src="facebook.svg" alt="Facebook"></a>
    <a href="https://www.instagram.com/la_garrinada/"><img class="social-icon" src="instagram.svg" alt="Instagram"></a>
  </footer>
</body>
</html>
